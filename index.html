
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JERRY Home</title>
  <style>
    :root{
      --bg:#050505;--panel:#101010;--fg:#f7f7f7;--muted:#9a9a9a;
      --line:#252525;--red:#e30613;--warn:#ffcc66;
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;overflow:hidden;
    }
    .app{height:100vh;padding:18px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
    header{
      display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;
      border-bottom:2px solid var(--line);padding-bottom:12px;
    }
    .logo{
      background:var(--red);color:#000;font-weight:950;font-size:clamp(28px,4.4vw,60px);
      padding:10px 22px;border-radius:18px;border:6px solid #000;letter-spacing:-.04em;
      white-space:nowrap;
    }
    .weather{text-align:right;font-weight:850;font-size:clamp(20px,3vw,44px)}
    .clock{text-align:right;font-weight:950;font-size:clamp(34px,5vw,76px);letter-spacing:-.05em}
    main{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:14px;min-height:0}
    section{
      background:var(--panel);border:1px solid var(--line);border-radius:18px;
      padding:16px;min-height:0;overflow:hidden;
    }
    h2{
      margin:0 0 12px;font-size:clamp(22px,2.8vw,42px);text-transform:uppercase;
      letter-spacing:-.03em;border-bottom:1px solid var(--line);padding-bottom:10px;
    }
    .row{
      display:grid;grid-template-columns:minmax(46px,.7fr) minmax(0,2.6fr) minmax(70px,.9fr);
      align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0;
      min-height:72px;
    }
    .line{font-size:clamp(30px,4vw,64px);font-weight:950;letter-spacing:-.06em}
    .dest{min-width:0}
    .to{font-size:clamp(22px,3vw,46px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .type{font-size:clamp(12px,1.5vw,22px);color:var(--muted);margin-top:4px}
    .min{text-align:right;font-size:clamp(30px,4vw,64px);font-weight:950;letter-spacing:-.06em}
    .min small{display:block;color:var(--muted);font-size:clamp(11px,1.4vw,18px);letter-spacing:0}
    footer{
      display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(12px,1.3vw,18px);
      border-top:1px solid var(--line);padding-top:8px;
    }
    .error{color:var(--warn);font-size:20px;padding:16px 0;line-height:1.35}
    @media (max-width:900px){
      body{overflow:auto}.app{height:auto;min-height:100vh}
      main{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">JERRY Home</div>
    <div></div>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="weather" id="weather">Bern · --°C</div>
    </div>
  </header>

  <main>
    <section>
      <h2>🚋 Bern Ostring</h2>
      <div id="ostring"></div>
    </section>

    <section>
      <h2>🚌 Giacomettistrasse</h2>
      <div id="giacometti"></div>
    </section>

    <section>
      <h2>🚆 Bern HB</h2>
      <div id="bern"></div>
    </section>
  </main>

  <footer>
    <span>Live · Bernmobil · SBB</span>
    <span id="updated">--</span>
  </footer>
</div>

<script>
const REFRESH_MS = 60000;
const stations = [
  {id:"ostring", name:"Bern, Ostring", limit:5},
  {id:"giacometti", name:"Bern, Giacomettistrasse", limit:5},
  {id:"bern", name:"Bern", limit:6}
];

function updateClock(){
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
}

function minUntil(iso){
  if(!iso) return "";
  const diff = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
  return Math.max(0, diff);
}

function label(item){
  return (item.number || item.category || "?").toString();
}

async function loadStation(st){
  const el = document.getElementById(st.id);
  const url = "https://transport.opendata.ch/v1/stationboard?station=" +
    encodeURIComponent(st.name) + "&limit=" + encodeURIComponent(st.limit);

  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const rows = data.stationboard || [];
    if(!rows.length){
      el.innerHTML = '<div class="error">Keine Abfahrten gefunden.</div>';
      return;
    }

    el.innerHTML = rows.map(item => {
      const stop = item.stop || {};
      const delay = stop.delay ? Math.round(stop.delay / 60) : 0;
      const sub = delay > 0 ? "Verspätung +" + delay + " Min" : (item.category || "");
      return `<div class="row">
        <div class="line">${label(item)}</div>
        <div class="dest">
          <div class="to">${item.to || ""}</div>
          <div class="type">${sub}</div>
        </div>
        <div class="min">${minUntil(stop.departure)}<small>Min</small></div>
      </div>`;
    }).join("");
  }catch(e){
    el.innerHTML = '<div class="error">Daten konnten nicht geladen werden.</div>';
  }
}

async function loadWeather(){
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474&current=temperature_2m,weather_code&timezone=Europe%2FZurich";
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    let icon = "☀️";
    if([1,2,3].includes(code)) icon = "⛅";
    if(code >= 45 && code <= 48) icon = "🌫️";
    if(code >= 51 && code <= 67) icon = "🌧️";
    if(code >= 71 && code <= 77) icon = "❄️";
    if(code >= 80 && code <= 82) icon = "🌦️";
    if(code >= 95) icon = "⛈️";
    document.getElementById("weather").textContent = `Bern · ${temp}°C ${icon}`;
  }catch(e){
    document.getElementById("weather").textContent = "Bern · Wetter --";
  }
}

async function refreshAll(){
  updateClock();
  loadWeather();
  await Promise.all(stations.map(loadStation));
  document.getElementById("updated").textContent =
    "Aktualisiert " + new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
}

updateClock();
refreshAll();
setInterval(updateClock, 1000);
setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
