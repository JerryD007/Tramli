
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HOME</title>
  <style>
    :root{--bg:#050505;--panel:#101010;--fg:#f7f7f7;--muted:#9a9a9a;--line:#252525;--red:#e30613;--warn:#ffcc66}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;overflow:hidden}
    .app{height:100vh;padding:18px;display:grid;grid-template-rows:auto 1fr auto;gap:14px}
    header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;border-bottom:2px solid var(--line);padding-bottom:12px}
    .logo{background:var(--red);color:#000;font-weight:950;font-size:clamp(36px,5vw,76px);padding:10px 30px;border-radius:18px;border:6px solid #000;letter-spacing:-.04em;text-transform:uppercase}
    .clock{text-align:right;font-weight:950;font-size:clamp(42px,6vw,88px);letter-spacing:-.05em}
    .weather{text-align:right;font-weight:850;font-size:clamp(22px,3vw,46px)}
    main{min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr;gap:12px}
    section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;overflow:hidden}
    h2{margin:0 0 8px;font-size:clamp(26px,3.2vw,50px);text-transform:uppercase;letter-spacing:-.03em;border-bottom:1px solid var(--line);padding-bottom:8px}
    .row{display:grid;grid-template-columns:90px 1fr 120px;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding:8px 0;min-height:54px}
    .line{font-size:clamp(30px,4.2vw,62px);font-weight:950;letter-spacing:-.06em}
    .to{font-size:clamp(26px,3.6vw,56px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .min{text-align:right;font-size:clamp(30px,4.2vw,62px);font-weight:950;letter-spacing:-.06em}
    .min small{font-size:clamp(12px,1.4vw,20px);color:var(--muted);letter-spacing:0}
    footer{display:flex;justify-content:space-between;color:var(--muted);font-size:clamp(13px,1.4vw,20px);border-top:1px solid var(--line);padding-top:8px}
    .error{color:var(--warn);font-size:22px;padding:12px 0}
    @media (max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">HOME</div>
    <div></div>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="weather" id="weather">Bern · --°C</div>
    </div>
  </header>

  <main>
    <section>
      <h2>🚋 Ostring</h2>
      <div id="ostring"></div>
    </section>

    <section>
      <h2>🚌 Giacomettistrasse</h2>
      <div id="giacometti"></div>
    </section>

    <section>
      <h2>🚆 Bern → Burgdorf</h2>
      <div id="bern_burgdorf"></div>
    </section>

    <section>
      <h2>🚆 Burgdorf → Bern</h2>
      <div id="burgdorf_bern"></div>
    </section>
  </main>

  <footer>
    <span>Live</span>
    <span id="updated">--</span>
  </footer>
</div>

<script>
const REFRESH_MS = 60000;

function updateClock(){
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
}

function minUntil(iso){
  if(!iso) return "";
  const diff = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
  return Math.max(0, diff);
}

function cleanTo(to){
  if(!to) return "";
  return to.replace(/^Bern,\s*/i,"").replace(/^Burgdorf,\s*/i,"");
}

function rowHtml(item){
  const stop = item.stop || {};
  const line = (item.number || item.category || "?").toString();
  const dest = cleanTo(item.to || "");
  return `<div class="row">
    <div class="line">${line}</div>
    <div class="to">R ${dest}</div>
    <div class="min">${minUntil(stop.departure)} <small>Min</small></div>
  </div>`;
}

async function stationboard(station, limit=20){
  const url = "https://transport.opendata.ch/v1/stationboard?station=" + encodeURIComponent(station) + "&limit=" + limit;
  const res = await fetch(url);
  if(!res.ok) throw new Error(res.status);
  const data = await res.json();
  return data.stationboard || [];
}

async function connections(from, to, limit=6){
  const url = "https://transport.opendata.ch/v1/connections?from=" + encodeURIComponent(from) + "&to=" + encodeURIComponent(to) + "&limit=" + limit;
  const res = await fetch(url);
  if(!res.ok) throw new Error(res.status);
  const data = await res.json();
  return data.connections || [];
}

async function loadFilteredStop(elId, station, allowedLines, limitOut){
  const el = document.getElementById(elId);
  try{
    const rows = await stationboard(station, 20);
    const filtered = rows.filter(x => allowedLines.includes((x.number || "").toString())).slice(0, limitOut);
    el.innerHTML = filtered.length ? filtered.map(rowHtml).join("") : '<div class="error">Keine passenden Abfahrten.</div>';
  }catch(e){
    el.innerHTML = '<div class="error">Daten konnten nicht geladen werden.</div>';
  }
}

function trainRowHtml(c, target){
  const dep = c.from && c.from.departure;
  let line = "Zug";
  if(c.products && c.products.length) line = c.products[0];
  return `<div class="row">
    <div class="line">${line}</div>
    <div class="to">R ${target}</div>
    <div class="min">${minUntil(dep)} <small>Min</small></div>
  </div>`;
}

async function loadDirectTrains(elId, from, to, label){
  const el = document.getElementById(elId);
  try{
    const rows = await connections(from, to, 8);
    const direct = rows.filter(c => (c.transfers === 0 || c.transfers === "0")).slice(0, 3);
    el.innerHTML = direct.length ? direct.map(c => trainRowHtml(c, label)).join("") : '<div class="error">Keine direkten Züge.</div>';
  }catch(e){
    el.innerHTML = '<div class="error">Daten konnten nicht geladen werden.</div>';
  }
}

async function loadWeather(){
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=46.9481&longitude=7.4474&current=temperature_2m,weather_code&timezone=Europe%2FZurich";
    const res = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    let icon = "☀️";
    if([1,2,3].includes(code)) icon = "⛅";
    if(code >= 45 && code <= 48) icon = "🌫️";
    if(code >= 51 && code <= 67) icon = "🌧️";
    if(code >= 71 && code <= 77) icon = "❄️";
    if(code >= 80 && code <= 82) icon = "🌦️";
    if(code >= 95) icon = "⛈️";
    document.getElementById("weather").textContent = `Bern · ${temp}°C ${icon}`;
  }catch(e){
    document.getElementById("weather").textContent = "Bern · Wetter --";
  }
}

async function refreshAll(){
  updateClock();
  loadWeather();
  await Promise.all([
    loadFilteredStop("ostring", "Bern, Ostring", ["7","40"], 4),
    loadFilteredStop("giacometti", "Bern, Giacomettistrasse", ["28"], 3),
    loadDirectTrains("bern_burgdorf", "Bern", "Burgdorf", "Burgdorf"),
    loadDirectTrains("burgdorf_bern", "Burgdorf", "Bern", "Bern")
  ]);
  document.getElementById("updated").textContent =
    "Aktualisiert " + new Date().toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"});
}

updateClock();
refreshAll();
setInterval(updateClock, 1000);
setInterval(refreshAll, REFRESH_MS);
</script>
</body>
</html>
